services:
  mongo:
    image: mongo:7
    container_name: ruleshop-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: |
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: ruleshop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  # Bucket S3-compatibil pentru imaginile de produs. Aplicatia vorbeste doar
  # prin driverul S3 (lib/storage/s3.ts), deci acelasi cod merge in productie
  # pe S3/R2/Spaces. Consola de administrare: http://localhost:9001
  minio:
    image: minio/minio:latest
    container_name: ruleshop-minio
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-ruleshop}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-ruleshop-secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  mongo-data:
  redis-data:
  minio-data:
